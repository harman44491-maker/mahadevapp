name: Windows Desktop EXE Build
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package.json
      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')" 
        env:
          VERSION: ${{ github.ref_name }}
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build portable Windows EXE
        working-directory: desktop
        run: npm run build
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: desktop/dist/*.exe
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: mahadev-ai-shorts-maker-windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error
