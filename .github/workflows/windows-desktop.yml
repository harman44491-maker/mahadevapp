name: Windows Desktop EXE Build
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build portable Windows EXE
        working-directory: desktop
        run: npm run build
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: mahadev-ai-shorts-maker-windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error
