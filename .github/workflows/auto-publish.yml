name: Rohitsworld Auto Publish
on:
  schedule:
    # Retry every 15 minutes across extended catch-up windows for each IST slot.
    # The API accepts retries for 150 minutes after 9 AM, 2 PM and 7 PM IST.
    # Its database unique index prevents duplicate publishing for the same slot.
    - cron: "*/15 3-6,8-11,13-16 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-publish.yml"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Generate a test preview only (does not publish)"
        required: true
        type: boolean
        default: true

concurrency:
  group: rohitsworld-auto-publish
  cancel-in-progress: false

jobs:
  trigger-auto-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger India-time publishing slot
        env:
          AUTO_SCHEDULER_TOKEN: ${{ secrets.AUTO_SCHEDULER_TOKEN }}
          TEST_MODE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test_mode) }}
        run: |
          if [ -z "$AUTO_SCHEDULER_TOKEN" ]; then
            echo "Missing repository secret AUTO_SCHEDULER_TOKEN"
            exit 1
          fi
          if [ "$TEST_MODE" = "true" ]; then
            BODY='{"testMode":true}'
            echo "Running safe test: generate preview only; nothing will be published."
          else
            BODY='{}'
            echo "Running scheduled publishing."
          fi
          curl --fail-with-body --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors --max-time 600 \
            -X POST "https://mahadev-ai-shorts-maker-api.onrender.com/internal/auto/publish" \
            -H "x-auto-scheduler-token: $AUTO_SCHEDULER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY"
